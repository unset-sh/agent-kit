name: ci

# Calls tooling's shared check, the single source of truth for how organisation repositories run CI.
# Pinned to a full tooling commit; docs/use-workflows.md in unset-sh/tooling describes the inputs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check rules, skills, sync and bundle
    uses: unset-sh/tooling/.github/workflows/ci-check.yml@7cd2e8c3d284cd9bb90c54f336adc0834b515d97
    permissions:
      contents: read
      packages: read # required by the shared check; the kit installs nothing
    with:
      timeout-minutes: 5
