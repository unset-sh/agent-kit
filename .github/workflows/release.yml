name: release

# A release is a tag v<version> on a commit of main. The bundle is built once, in `bundle`; `publish` waits for
# approval on the `release` environment and then attests and publishes those same files. Repositories install
# a release with sync.mjs, which downloads agent-kit.json from the release page.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: Check and build the bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The tag is the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run check
      - name: Build the bundle, with sync.mjs and the release notes beside it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/bundle.mjs --commit "$GITHUB_SHA" --out dist/agent-kit.json
          cp sync.mjs dist/sync.mjs
          node scripts/release-notes.mjs "${TAG#v}" > dist/notes.md
          sha256sum dist/agent-kit.json dist/sync.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write # create the release page with the workflow's own token; no stored secret
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Exactly the three built files
        run: test "$(ls dist | sort | tr '\n' ' ')" = "agent-kit.json notes.md sync.mjs "
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/agent-kit.json
            dist/sync.mjs
      - name: Publish on the release page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/agent-kit.json dist/sync.mjs --verify-tag --title "$TAG" --notes-file dist/notes.md
